# Production SSL vhost template for Navigrader.
# Requires Apache modules: ssl, headers, proxy, proxy_http, rewrite.

<VirtualHost *:80>
    ServerName navigrader.com
    ServerAlias www.navigrader.com *.navigrader.com
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName www.navigrader.com
    ServerAlias navigrader.com *.navigrader.com
    ServerAdmin webmaster@localhost

    DocumentRoot /var/www/home-school-management/web
    DirectoryIndex index.html

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/www.navigrader.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/www.navigrader.com/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLHonorCipherOrder off

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.stripe.com; script-src 'self' https://js.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

    LimitRequestBody 10485760
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 60

    <Directory /var/www/home-school-management/web>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Alias /control /var/www/home-school-management/control
    Alias /control/ /var/www/home-school-management/control/

    <Directory /var/www/home-school-management/control>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^(www\.)?navigrader\.com$ [NC]
    RewriteRule ^/?$ /saas.html [END]

    ProxyPass /api/ http://192.168.1.200:3000/api/
    ProxyPassReverse /api/ http://192.168.1.200:3000/api/

    ProxyPass /health http://192.168.1.200:3000/health
    ProxyPassReverse /health http://192.168.1.200:3000/health

    ProxyPass /control-api/ http://192.168.1.200:3100/
    ProxyPassReverse /control-api/ http://192.168.1.200:3100/

    ErrorLog ${APACHE_LOG_DIR}/navigrader-production-error.log
    CustomLog ${APACHE_LOG_DIR}/navigrader-production-access.log combined
</VirtualHost>
